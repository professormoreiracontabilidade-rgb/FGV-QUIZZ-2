*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:19px;line-height:1.57;-webkit-text-size-adjust:100%}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #edb72a;outline-offset:3px}#app{max-width:840px;margin:0 auto;padding:12px 12px 102px}.mast{background:linear-gradient(125deg,#081d37,#153c68 77%,#205080);color:#fff;padding:18px 18px 20px;border-radius:18px 18px 7px 7px;border-bottom:5px solid var(--gold);box-shadow:0 10px 25px #081d371c}.brand{font-weight:900;letter-spacing:.035em;line-height:1.2;font-size:clamp(16px,4.6vw,21px)}.brand strong{color:#ffcf73;display:block;font-size:1.06em}.mastline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.pill{background:#ffffff1b;border:1px solid #ffffff40;border-radius:40px;padding:6px 14px;font-weight:800;font-size:.87em}.whitecard{background:white;padding:18px;border-radius:7px 7px 16px 16px;border:1px solid var(--line);box-shadow:0 8px 22px #1128410b}.cover{padding:27px 20px 35px;text-align:center}.cover h1{font-size:clamp(32px,8vw,55px);color:var(--navy);line-height:1.1;margin:14px 0 18px;letter-spacing:-.025em}.eyebrow{font-size:.83em;letter-spacing:.13em;color:#385a7b;text-transform:uppercase;font-weight:900}.lede{font-size:1.12em;color:#3b536a;max-width:600px;margin:10px auto 27px}.highlights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:550px;margin:26px auto}.hl{border:1px solid #d9e4ed;border-radius:13px;padding:12px 7px;background:#f8fbff}.hl b{display:block;font-size:1.7em;color:var(--navy)}.hl span{font-size:.72em;color:var(--muted);font-weight:700}.primary,.outline,.subtle,.danger{border-radius:14px;min-height:54px;padding:12px 18px;font-size:1.03em;font-weight:800}.primary{background:var(--navy);color:#fff;border:2px solid var(--navy);box-shadow:0 5px 13px #10325533}.outline{background:#fff;color:var(--navy);border:2px solid #9bb1c8}.subtle{background:#eef3f8;color:var(--navy);border:2px solid #d1deeb}.danger{background:#fff;color:#ad2f36;border:2px solid #e7b6b6}.primary:disabled,.outline:disabled,.subtle:disabled{opacity:.43;cursor:not-allowed}.big-btn{width:100%;max-width:540px}.minibtn{border:0;background:transparent;color:#365470;padding:7px;text-decoration:underline;font-size:.84em;font-weight:650}.questiontop{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:.84em;font-weight:800;margin:12px 0 6px}.bar{height:12px;background:#d6e2ec;border-radius:14px;overflow:hidden;margin-bottom:17px}.bar>div{height:100%;background:linear-gradient(90deg,#f3bc48,#f7db8c);border-radius:inherit;transition:width .25s}.topic{display:inline-block;border-radius:20px;background:#e7eef7;color:#214a76;font-weight:800;font-size:.85em;padding:5px 12px;margin:3px 0 11px}.qtitle{font-size:clamp(22px,5.8vw,29px);line-height:1.42;margin:4px 0 18px;font-weight:750;white-space:pre-wrap}.answers{display:grid;gap:11px}.opt{display:flex;align-items:flex-start;gap:13px;border:2px solid #d9e4ec;padding:14px 13px;background:white;border-radius:14px;width:100%;text-align:left;line-height:1.46;font-size:1.04em;color:var(--ink)}.opt:not([disabled]):hover{border-color:#6a97c0;background:#f7faff}.opt.selected{border-color:var(--blue);background:#ecf4ff}.opt .letter{width:40px;height:40px;border-radius:10px;flex:0 0 40px;display:inline-grid;place-items:center;background:#e5edf6;color:#163960;font-weight:900}.opt.right{background:#e3f7e9;border-color:#238b5f}.opt.right .letter{background:#187b52;color:white}.opt.wrong{background:#ffe8e8;border-color:#ce4b51}.opt.wrong .letter{background:#bb3e45;color:white}.opt[disabled]{cursor:default;opacity:1}.tools{display:flex;gap:11px;align-items:center;margin-top:18px;flex-wrap:wrap}.tools .primary{flex:1}.tip{font-size:.82em;color:var(--muted);margin-top:10px}.feedback{margin-top:23px;border-radius:15px;overflow:hidden;border:1px solid #b8d9c7;background:#f6fff9;scroll-margin-top:12px}.feedback.fail{background:#fffaf9;border-color:#ecc3c5}.feedback .fhead{padding:13px 16px;background:#d7f2df;display:flex;align-items:center;gap:11px;font-weight:900;color:#116540;font-size:1.06em}.feedback.fail .fhead{background:#ffe6e6;color:#a83136}.status-icon{font-size:1.3em}.fbcontent{padding:15px 17px 19px}.fbcontent h3{font-size:1em;color:var(--navy);margin:13px 0 4px}.fbcontent p{margin:0 0 13px;white-space:pre-line}.gabarito{border-left:5px solid var(--gold);padding:10px 13px;margin:10px 0 17px;background:#fff8e8;border-radius:3px 10px 10px 3px;font-weight:850}.sourcehint{border:1px solid #e4d4ad;background:#fffaf0;border-radius:9px;margin-top:12px;padding:10px 13px;font-size:.87em;color:#705421}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));background:#fbfcffed;backdrop-filter:blur(14px);border-top:1px solid #ccd8e4;box-shadow:0 -5px 25px #0924431a}.navin{max-width:830px;margin:auto;display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.nav .primary,.nav .outline,.nav .subtle{min-height:52px;font-size:.95em;padding:9px 8px}.nav .subtle{padding:9px 13px}.flash{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .15s;background:radial-gradient(circle at 50% 45%,#23e58574,#009b4a23 60%,#08854318);box-shadow:inset 0 0 0 14px #21bd5b88}.flash.error{background:radial-gradient(circle at 50% 45%,#fb32328a,#d92c2c24 60%,#b92a2a1c);box-shadow:inset 0 0 0 14px #d7323299}.flash.show{opacity:1}.flash .flashmsg{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#087449;color:#fff;box-shadow:0 5px 20px #10101033;border-radius:40px;padding:11px 25px;font-size:1.25em;font-weight:950;text-align:center;white-space:nowrap}.flash.error .flashmsg{background:#b92932}.results h2{font-size:2em;text-align:center;margin:14px 0}.score{font-size:clamp(55px,13vw,87px);color:var(--navy);text-align:center;line-height:1.2;font-weight:900}.scoresub{text-align:center;color:#53708c;margin:2px 0 22px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.metric{background:#f4f8fc;border-radius:13px;text-align:center;padding:14px 8px}.metric strong{font-size:1.4em;display:block}.metric span{font-size:.75em;color:var(--muted);font-weight:750}.review{display:grid;gap:8px;margin-top:18px}.review button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;padding:12px;border-radius:11px;color:var(--ink);text-align:left}.rmark{font-weight:900}.rmark.ok{color:#0d8757}.rmark.bad{color:#b63a3b}.rmark.skip{color:#667d90}.small{font-size:.85em;color:var(--muted)}.lightlabel{color:#ffd686;font-weight:900}.result-actions{display:grid;gap:10px;margin:18px 0 8px}

<script>
'use strict';
const QUIZ_NUM=2, DATA=[{"original":2,"topic":"CONCEITOS BÁSICOS DA CONTABILIDADE","prompt":"O Balanço Patrimonial é o principal relatório gerado pela Contabilidade, pois permite avaliar a saúde financeira e econômica da empresa em uma data específica, seja no final do ano ou em outro momento pré- determinado. O conjunto de bens e direitos controlados pela empresa denomina-se","options":["passivo.","capital social.","leasing.","ativo.","capital próprio."],"answer":"D","why":"Ativo é o conjunto de recursos econômicos controlados pela entidade, abrangendo bens e direitos. Caixa, estoques, máquinas e valores a receber são exemplos típicos.","others":"Passivo são obrigações; capital social e capital próprio integram o patrimônio líquido; leasing ou arrendamento descreve uma operação contratual, não o conjunto de bens e direitos."},{"original":7,"topic":"FATOS CONTÁBEIS","prompt":"Assinale a opção que indica uma transação que não impacta o saldo do ativo total.","options":["Compra a prazo de estoques.","Aumento de capital social por meio de um terreno.","Reconhecimento de provisão para contingências.","Reconhecimento e pagamento de despesa de salários.","Reconhecimento da despesa de depreciação de ativo imobilizado."],"answer":"C","why":"O reconhecimento de uma provisão para contingência, quando reconhecida como despesa, aumenta o passivo e reduz o PL sem movimentar o ativo naquele momento.","others":"Compra de estoque a prazo e integralização com terreno elevam o ativo; salário reconhecido e pago reduz disponibilidades; depreciação diminui o valor contábil do ativo por conta retificadora."},{"original":12,"topic":"ESCRITURAÇÃO E PARTIDAS DOBRADAS","prompt":"Assinale a opção que indica o reconhecimento de um passivo no balanço patrimonial de uma entidade.","options":["Pagamento antecipado de despesa.","Pagamento de um empréstimo bancário.","Reconhecimento de provisão para contingência.","Reconhecimento do uso de um ativo imobilizado.","Venda de estoque, sendo metade à vista e o restante a prazo."],"answer":"C","why":"A provisão para contingência reconhecível traduz obrigação presente de saída provável de recursos e estimativa confiável; assim, origina passivo no balanço.","others":"Pagamento antecipado cria ativo; quitação de empréstimo reduz passivo; uso de imobilizado em geral gera despesa e depreciação acumulada; venda de estoque origina receita, recebíveis e baixa de estoque, não necessariamente novo passivo."},{"original":17,"topic":"BALANÇO PATRIMONIAL","prompt":"No balanço patrimonial de uma sociedade empresária, o patrimônio líquido representa","options":["as obrigações com terceiros.","o valor contábil pertencente aos acionistas ou sócios.","os ativos que foram integralizados pelos proprietários.","os bens e os direitos com expectativa de retorno futuro.","a diferença entre as aplicações e as origens de recursos."],"answer":"B","why":"O patrimônio líquido é o interesse residual dos proprietários: ativos menos passivos. Ele representa o valor contábil atribuível aos sócios ou acionistas.","others":"Obrigações a terceiros pertencem ao passivo; bens e direitos pertencem ao ativo; capital integralizado é só parte do patrimônio líquido, que também inclui reservas e resultados acumulados."},{"original":22,"topic":"ESTRUTURA CONCEITUAL (CPC 00)","prompt":"Segundo a NBC TG Estrutura Conceitual- Estrutura Conceitual para Relatório Financeiro, as receitas e as despesas são os elementos das demonstrações contábeis de uma entidade que se referem a(o)","options":["Posição financeira.","Posição econômica.","Situação patrimonial.","Desempenho financeiro.","Desempenho econômico."],"answer":"D","why":"Receitas e despesas são elementos que retratam o desempenho financeiro da entidade, pois expressam aumentos e reduções de patrimônio líquido que não decorrem de aportes/distribuições de proprietários.","others":"Posição financeira e situação patrimonial são descritas por ativos, passivos e PL; “posição econômica” e “desempenho econômico” não são os termos empregados pelo gabarito da Estrutura Conceitual nessa distinção."},{"original":27,"topic":"DEMONSTRAÇÃO DO RESULTADO (DRE)","prompt":"As opções a seguir apresentam deduções da receita bruta de vendas quando da elaboração da Demonstração do Resultado do Exercício, com exceção de uma. Assinale-a.","options":["Devoluções.","Abatimentos.","Vendas canceladas.","Impostos incidentes sobre vendas.","Perdas estimadas com crédito de liquidação duvidosa."],"answer":"E","why":"PECLD reconhece risco de inadimplência de clientes como despesa e ajuste dos recebíveis; não é dedução da receita bruta de vendas.","others":"Devoluções, abatimentos, cancelamentos e tributos incidentes sobre vendas ajustam a receita bruta para apuração da receita líquida, motivo pelo qual A, B, C e D não são exceções."},{"original":32,"topic":"REGIME DE COMPETÊNCIA E CAIXA","prompt":"O contador da empresa Beta precisa registrar o valor dos juros relativos a um empréstimo tomado pela empresa. De acordo com a lógica do regime de competência, o lançamento a débito deverá ser realizado em uma conta de:","options":["caixa e equivalentes de caixa;","despesas com juros;","empréstimos;","encargos financeiros a transcorrer;","variações monetárias passivas."],"answer":"B","why":"No regime de competência, juros incorridos são reconhecidos como despesa do período; a conta debitada é Despesas com Juros.","others":"Caixa é ativo, empréstimo é obrigação e encargos a transcorrer pode ser redutora do passivo; variações monetárias só seriam apropriadas se pertinentes, não substituem a despesa específica de juros solicitada."},{"original":37,"topic":"ESTOQUES (CPC 16)","prompt":"Uma loja de material de construção controla o seu estoque exclusivamente através de contagem física, realizada trimestralmente, antes da elaboração das demonstrações contábeis trimestrais. Pode-se afirmar que a loja controla o seu estoque por meio do inventário","options":["padrão.","periódico.","ponderado.","permanente.","de observação."],"answer":"B","why":"Inventário periódico calcula o estoque disponível ao fim do período por contagem física; é o método descrito, com conferência trimestral.","others":"Permanente acompanha entradas e saídas continuamente; ponderado se refere à avaliação por custo médio, e as demais expressões não denominam o sistema padrão de controle solicitado."},{"original":42,"topic":"PEPS E CUSTO MÉDIO","prompt":"Uma loja compra estoques para revenda, trimestralmente. A loja verificou que a cada trimestre o preço cobrado pelo seu fornecedor aumentava em 2%. Até 2022, a loja avaliava, internamente, o seu estoque de acordo com o método UEPS. Em 2023, a loja passou a avaliar o estoque de acordo com o custo médio ponderado móvel. Ao comparar os valores de acordo com os dois métodos, é correto afirmar que, de acordo com o UEPS, o estoque e o custo das mercadorias vendidas parecem, respectivamente,","options":["menor e maior.","maior e menor.","menor e menor.","maior e maior.","igual e menor."],"answer":"A","why":"Em ambiente de custos crescentes, UEPS leva os lotes mais caros ao CMV, elevando o custo vendido e deixando no estoque os lotes antigos mais baratos. Logo, estoque menor e CMV maior do que pela média móvel.","others":"As alternativas que apontam estoque maior ou CMV menor invertem o efeito do UEPS. Observação: o exercício é comparativo e hipotético; UEPS não é aceito para demonstrações sob CPC 16."},{"original":47,"topic":"ATIVO IMOBILIZADO (CPC 27)","prompt":"Uma empresa de auditoria exerce suas atividades em um prédio próprio e aluga as vagas da garagem a seus funcionários. Assinale a opção que indica a classificação contábil das vagas no balanço patrimonial da empresa.","options":["Ativo Circulante.","Ativo Realizável a Longo Prazo.","Propriedade para Investimento.","Ativo Imobilizado.","Ativo Intangível."],"answer":"D","why":"O imóvel é utilizado na operação da própria empresa de auditoria, e a garagem é parte acessória desse imóvel; a cobrança a funcionários não altera, por si só, sua destinação predominante ao uso.","others":"Ativo Circulante e Realizável a Longo Prazo não representam essa função; propriedade para investimento pressupõe finalidade de obter aluguel/valorização como investimento; intangível não é imóvel físico."},{"original":52,"topic":"DEPRECIAÇÃO E AMORTIZAÇÃO","prompt":"Relacione os tipos de bens, listados a seguir, aos seus respectivos processos de perda de valor. 1. Direitos Autorais 2. Reserva de petróleo 3. Imóvel ( ) Depreciação ( ) Exaustão ( ) Amortização Assinale a opção que apresenta a relação correta, segundo a ordem apresentada.","options":["1, 2, 3","1, 3, 2","2, 1, 3","3, 1, 2","3, 2, 1"],"answer":"E","why":"A ordem é: imóvel → depreciação (3); reserva de petróleo → exaustão (2); direitos autorais → amortização (1). Resultado: 3, 2, 1.","others":"Todas as demais sequências atribuem ao menos um processo incorreto, como depreciação de direito autoral ou amortização de reserva mineral."},{"original":57,"topic":"ATIVO INTANGÍVEL (CPC 04)","prompt":"De acordo com o Pronunciamento Técnico CPC 04 (R1) - Ativo Intangível, entre os ativos gerados internamente em uma entidade, são geralmente contabilizados no Balanço Patrimonial, como Ativo Intangível,","options":["os equipamentos.","os softwares de computadores.","as marcas.","os títulos das publicações.","as listas de clientes."],"answer":"B","why":"Software desenvolvido internamente pode ser reconhecido como ativo intangível quando preenche os critérios de desenvolvimento e mensuração confiável.","others":"Equipamentos são imobilizado; marcas, títulos de publicações e listas de clientes gerados internamente normalmente não são reconhecidos como intangíveis separáveis pelo CPC 04."},{"original":62,"topic":"IMPAIRMENT (CPC 01)","prompt":"O contador de uma entidade incorreu em um erro e não reconheceu a reversão do teste de impairment dos ativos imobilizados dela. Assinale a opção que indica o efeito que esse erro causou ao patrimônio da entidade.","options":["Subavaliação do ativo e do passivo.","Subavaliação do ativo e do patrimônio líquido.","Superavaliação do ativo e do passivo.","Superavaliação do ativo e do patrimônio líquido.","Superavaliação do passivo e subavaliação do patrimônio líquido."],"answer":"B","why":"Se uma reversão de impairment devida não for reconhecida, o ativo permanece indevidamente reduzido e o resultado/PL fica menor do que deveria. Há subavaliação de ativo e patrimônio líquido.","others":"O passivo não é afetado diretamente por reversão dessa perda, descartando A, C e E; D fala em superavaliação, que seria o efeito oposto ao não reconhecer a reversão."},{"original":67,"topic":"CLIENTES E PECLD","prompt":"Uma empresa vendeu mercadorias a prazo por R$ 50.000,00 com vencimento para 10 meses. Com base em estimativas passadas, a companhia projeta que 5% dessas vendas não serão cobradas. Dessa forma, o contador deve contabilizar uma:","options":["provisão para devedores duvidosos e credora de R$ 2.500,00 no ativo;","perda estimada de créditos de liquidação duvidosa e credora de R$ 2.500,00 no ativo;","provisão para devedores duvidosos e devedora de R$ 2.500,00 no ativo;","perda estimada de créditos de liquidação duvidosa e devedora de R$ 2.500,00 no ativo;","provisão para devedores duvidosos e devedora de R$ 5.000,00 no resultado."],"answer":"B","why":"5% de R$ 50.000 = R$ 2.500. A PECLD é conta retificadora de natureza credora no ativo, formada contra despesa no resultado.","others":"Provisão para devedores duvidosos é nomenclatura antiga e menos precisa; alternativas devedoras invertem a natureza da retificadora; R$ 5.000 erra a taxa."},{"original":72,"topic":"DESPESAS ANTECIPADAS","prompt":"Uma entidade paga, de modo adiantado, o salário de seus empregados, sempre no primeiro dia do mês a ser trabalhado. Assinale a opção que indica o efeito nos elementos patrimoniais no momento do pagamento do salário.","options":["Aumento no ativo e diminuição no ativo.","Diminuição no ativo e diminuição no passivo.","Diminuição no ativo e diminuição no patrimônio líquido.","Aumento no passivo e diminuição no patrimônio líquido.","Aumento no patrimônio líquido e diminuição no patrimônio líquido."],"answer":"A","why":"Salário pago antes do trabalho gera adiantamento a empregado (ativo), enquanto Caixa diminui (outro ativo). É permuta entre contas do ativo no pagamento antecipado.","others":"Não há obrigação reduzida, nem despesa ou redução de PL naquele instante, porque o empregado ainda não prestou o serviço referente à remuneração adiantada."},{"original":77,"topic":"PROVISÕES E CONTINGÊNCIAS","prompt":"De acordo com o Pronunciamento Técnico CPC 25- Provisões, Passivos Contingentes e Ativos Contingentes, deve-se reconhecer no Balanço Patrimonial, apenas","options":["os ativos contingentes.","os passivos contingentes.","as provisões para contingências.","os ativos e os passivos contingentes.","os passivos contingentes e as provisões para contingências."],"answer":"C","why":"Reconhecem-se provisões quando há obrigação presente, saída provável e estimativa confiável. Ativos e passivos contingentes não são reconhecidos no balanço apenas por serem contingentes.","others":"As opções que incluem contingentes como saldos reconhecidos contrariam o CPC 25; ativos contingentes podem ser divulgados em condições específicas, mas não contabilizados como ativo contingente."},{"original":82,"topic":"DEMONSTRAÇÃO DOS FLUXOS DE CAIXA","prompt":"Uma sociedade empresária mantém títulos para fins de negociação imediata. Os fluxos de caixa advindos da venda desses títulos são classificados como","options":["equivalentes de caixa.","atividade financeira.","atividade operacional.","atividade de investimento.","atividade de financiamento."],"answer":"C","why":"Títulos mantidos para negociação imediata são vinculados à atividade habitual de negociação; seus fluxos de venda são operacionais no contexto indicado.","others":"Equivalentes de caixa designam investimentos de curtíssimo prazo de alta liquidez, não uma categoria de atividade; financiamento capta/devolve recursos; investimento normalmente abrange ativos de longo prazo."},{"original":87,"topic":"DEMONSTRAÇÃO DO VALOR ADICIONADO","prompt":"Em X1, uma sociedade empresária resolveu distribuir como dividendos, parte do lucro auferido no ano de X0. Assinale a opção que indica o tratamento contábil destes dividendos na Demonstração do Valor Adicionado, em 31/12/X1.","options":["Ajustes de exercícios anteriores.","Remuneração de capitais de terceiros.","Remuneração de capitais próprios.","Valor adicionado recebido em transferência.","Não devem ser contabilizados."],"answer":"E","why":"Dividendos relativos a lucro de X0 distribuídos em X1 não devem entrar novamente como valor distribuído na DVA de X1, porque a distribuição do valor adicionado pertenceu ao exercício em que o resultado foi apurado.","others":"Remuneração de capitais próprios seria a rubrica no exercício pertinente, mas repetir em X1 duplicaria a destinação já considerada; não é ajuste de exercício anterior nem valor recebido em transferência."},{"original":92,"topic":"RESERVAS DE LUCROS","prompt":"Em empresas S.A., uma das reservas reflete as contribuições feitas pelos acionistas que estão diretamente relacionados à formação ou ao incremento do capital social e também os planos de incentivo de longo prazo. Trata-se de reserva:","options":["legal;","de lucros;","de capital;","de contingência;","estatutária de lucros para investimentos futuros."],"answer":"C","why":"Reservas de capital são compostas por certas contribuições dos sócios que não integram diretamente capital social, como ágio na emissão de ações, além de outras hipóteses legais.","others":"Reserva legal, estatutária, de contingências e reservas de lucros partem de apropriações de lucro, não da contribuição direta dos acionistas descrita na questão."},{"original":97,"topic":"DIVIDENDOS","prompt":"Uma entidade distribuiu, em X1, R$40.000 por conta de dividendos obrigatórios e R$20.000 por conta de dividendos adicionais aos obrigatórios. No Balanço Patrimonial, deve ser contabilizado no Patrimônio Líquido, a título de dividendos,","options":["Zero.","R$ 20.000.","R$ 40.000.","R$ 60.000.","R$ 80.000."],"answer":"B","why":"Somente R$ 20.000 dos dividendos adicionais aos obrigatórios permanecem indicados no PL de acordo com o tratamento cobrado; os R$ 40.000 obrigatórios são passivo quando configurada a obrigação.","others":"Zero ignora os dividendos adicionais em PL; R$ 40.000 e R$ 60.000 misturam parcelas obrigatórias e adicionais; R$ 80.000 não corresponde a nenhum total do enunciado."}], TAG='moreira_quiz_fgv_2026_v3_'+QUIZ_NUM;
const app=document.querySelector('#app'), footer=document.querySelector('#footer');
const letters=['A','B','C','D','E'];
let state={screen:'cover',index:0,selected:Array(20).fill(null),confirmed:Array(20).fill(false)};
try{let prior=JSON.parse(localStorage.getItem(TAG)||'null');if(prior&&prior.selected?.length===20&&prior.confirmed?.length===20){state={...state,index:Math.max(0,Math.min(19,prior.index||0)),selected:prior.selected,confirmed:prior.confirmed};}}catch(e){}
function save(){try{localStorage.setItem(TAG,JSON.stringify({index:state.index,selected:state.selected,confirmed:state.confirmed}));}catch(e){}}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asText=s=>escapeHTML(s).replace(/\n/g,'<br>');
const result=()=>({n:state.confirmed.filter(Boolean).length,good:state.confirmed.filter((c,i)=>c&&letters[state.selected[i]]===DATA[i].answer).length});
function mast(head){return `<header class="mast"><div class="brand">CURSO DE CONTABILIDADE <strong>PROFESSOR MOREIRA</strong></div><div class="mastline"><span class="pill">QUESTÕES BÁSICAS DA FGV</span><span class="pill">QUIZ ${QUIZ_NUM} DE 5</span></div></header>`;}
function render(){let view='';if(state.screen==='cover'){let score=result();view=mast()+`<section class="whitecard cover"><div class="eyebrow">Treinamento interativo • FGV</div><h1>Questões Básicas da FGV</h1><div class="lede">20 questões de Contabilidade Geral, abrangendo 20 assuntos diferentes. Responda, confirme e veja a correção detalhada imediatamente abaixo.</div><div class="highlights"><div class="hl"><b>20</b><span>QUESTÕES</span></div><div class="hl"><b>20</b><span>ASSUNTOS</span></div><div class="hl"><b>${score.n}</b><span>JÁ RESPONDIDAS</span></div></div><button class="primary big-btn" data-act="start">${score.n?'▶ Continuar de onde parou':'▶ Começar o Quiz '+QUIZ_NUM}</button><p class="small">Sem senha e sem trava. Funciona sem internet depois de salvo. Seu progresso fica neste navegador.</p>${score.n?'<button class="minibtn" data-act="reset">Reiniciar todas as respostas</button>':''}</section>`;footer.hidden=true;}
else if(state.screen==='results'){let s=result(),pct=Math.round(s.good/20*100),miss=s.n-s.good;view=mast()+`<section class="whitecard results"><div class="eyebrow">Relatório do aluno — Quiz ${QUIZ_NUM}</div><h2>Resultado do treinamento</h2><div class="score">${pct}%</div><div class="scoresub">${s.good} acertos em 20 questões • pontuação de 0 a 100%</div><div class="metrics"><div class="metric"><strong>${s.good}</strong><span>ACERTOS</span></div><div class="metric"><strong>${miss}</strong><span>ERROS</span></div><div class="metric"><strong>${20-s.n}</strong><span>NÃO RESPONDIDAS</span></div></div><p>${s.good===20?'Excelente! Você acertou todas as questões.':s.good>=15?'Bom desempenho. Revise especialmente os erros comentados.':'Revise as explicações e refaça as questões com atenção aos conceitos.'}</p><div class="result-actions"><button class="primary" data-act="review">↩ Rever as questões</button><button class="outline" data-act="cover">⌂ Voltar à capa</button><button class="danger" data-act="reset">⟳ Reiniciar Quiz ${QUIZ_NUM}</button></div><h3>Revisão por assunto</h3><div class="review">${DATA.map((q,i)=>{let status=state.confirmed[i]?(letters[state.selected[i]]===q.answer?'ok':'bad'):'skip';return `<button data-act="jump" data-index="${i}"><span><strong>${String(i+1).padStart(2,'0')}.</strong> ${escapeHTML(q.topic)}</span><span class="rmark ${status}">${status==='ok'?'✓':status==='bad'?'✕':'—'}</span></button>`}).join('')}</div></section>`;footer.hidden=true;}
else{let i=state.index,q=DATA[i],done=state.confirmed[i],chosen=state.selected[i],correctIdx=letters.indexOf(q.answer),pass=done&&chosen===correctIdx,s=result();view=mast()+`<section class="whitecard"><div class="questiontop"><span>QUESTÃO ${i+1} DE 20</span><span>${s.n} respondidas</span></div><div class="bar" role="progressbar" aria-valuenow="${s.n}" aria-valuemax="20"><div style="width:${s.n/20*100}%"></div></div><span class="topic">${escapeHTML(q.topic)}</span><h2 class="qtitle">${asText(q.prompt)}</h2><div class="answers" role="radiogroup" aria-label="Selecione uma alternativa">${q.options.map((o,j)=>`<button class="opt ${chosen===j?'selected':''} ${done?(j===correctIdx?'right':(j===chosen?'wrong':'')):''}" data-act="select" data-option="${j}" ${done?'disabled':''} aria-pressed="${chosen===j}"><span class="letter">${letters[j]}</span><span>${asText(o)}</span></button>`).join('')}</div><div class="tools">${!done?`<button class="primary" data-act="confirm" ${chosen==null?'disabled':''}>✓ Confirmar resposta</button>`:`<button class="subtle" data-act="redo">↺ Refazer esta questão</button>`}</div>${done?`<article class="feedback ${pass?'':'fail'}" id="correcao"><div class="fhead"><span class="status-icon">${pass?'✓':'✕'}</span>${pass?'Você acertou! Luz verde.':'Você errou. Luz vermelha.'}</div><div class="fbcontent"><div class="gabarito">GABARITO DA COLETÂNEA: ALTERNATIVA ${q.answer} — ${escapeHTML(q.options[correctIdx])}</div><h3>Por que essa alternativa está correta?</h3><p>${asText(q.why)}</p><h3>Por que as outras alternativas estão incorretas?</h3><p>${asText(q.others)}</p><div class="sourcehint">Correção didática elaborada a partir das questões e do gabarito da coletânea fornecida. Quando há ressalvas, elas aparecem no comentário.</div></div></article>`:''}</section>`;
footer.hidden=false;footer.innerHTML=`<div class="navin"><button class="outline" data-act="prev" ${i===0?'disabled':''}>← Voltar</button><button class="primary" data-act="next">${i===19?'Finalizar ✓':'Avançar →'}</button><button class="subtle" data-act="reset" title="Reiniciar as 20 questões" aria-label="Reiniciar quiz">⟳</button></div>`;}
app.innerHTML=view;}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'});}
function flash(success){let el=document.querySelector('#flash');el.className='flash '+(success?'':'error')+' show';document.querySelector('#flashmsg').textContent=success?'✓ ACERTOU!':'✕ ERROU!';window.clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.remove('show'),900);}
function reset(){if(confirm('Reiniciar este quiz? Isso apagará as respostas salvas das 20 questões.')){state.index=0;state.selected=Array(20).fill(null);state.confirmed=Array(20).fill(false);state.screen='cover';save();render();scrollTop();}}
function nav(i){state.index=Math.min(19,Math.max(0,i));state.screen='question';save();render();scrollTop();}
document.addEventListener('click',e=>{let btn=e.target.closest('button[data-act]');if(!btn)return;let cmd=btn.dataset.act;if(cmd==='start'){nav(state.index);}
else if(cmd==='select'){if(!state.confirmed[state.index]){state.selected[state.index]=Number(btn.dataset.option);save();render();}}
else if(cmd==='confirm'){let i=state.index,q=DATA[i];if(state.selected[i]==null||state.confirmed[i])return;state.confirmed[i]=true;save();render();flash(letters[state.selected[i]]===q.answer);setTimeout(()=>document.querySelector('#correcao')?.scrollIntoView({block:'start',behavior:'smooth'}),90);}
else if(cmd==='redo'){state.confirmed[state.index]=false;state.selected[state.index]=null;save();render();}
else if(cmd==='prev'){nav(state.index-1);}
else if(cmd==='next'){state.index===19?(state.screen='results',save(),render(),scrollTop()):nav(state.index+1);}
else if(cmd==='reset'){reset();}
else if(cmd==='review'){nav(0);}
else if(cmd==='jump'){nav(Number(btn.dataset.index));}
else if(cmd==='cover'){state.screen='cover';save();render();scrollTop();}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&state.screen==='question'&&!e.altKey&&!e.ctrlKey){if(state.index===19){state.screen='results';render();scrollTop();}else nav(state.index+1);}if(e.key==='ArrowLeft'&&state.screen==='question'&&!e.altKey&&!e.ctrlKey&&state.index>0)nav(state.index-1);});
render();
</script></body></html>
